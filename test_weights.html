<!DOCTYPE html>
<html>
<head>
<meta charset='utf-8'>
<style>
  body { background: white; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; padding: 40px; }
  .row { display: flex; align-items: center; gap: 24px; margin-bottom: 24px; }
  .item { display: flex; align-items: center; gap: 10px; }
  .wm { font-weight: 700; font-size: 18px; color: #0f172a; letter-spacing: -0.02em; }
  .ai { font-weight: 800; font-size: 16px; color: #0d9488; margin-left: 2px; }
</style>
</head>
<body>
<h3>Comparing Stroke Weights at 36px (Navbar Size)</h3>

<div class='row'>
  <div class='item'>
    <svg width="36" height="36" viewBox="0 0 48 48" fill="none">
      <path d="M11 36V19C11 13 15 10.5 20 12.5L24 25H37" stroke="#0D9488" stroke-width="4.0" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M37 36V19C37 13 33 10.5 28 12.5L24 25H11" stroke="#0F172A" stroke-width="4.0" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <div><span class='wm'>MediBridge</span><span class='ai'>AI</span></div>
    <span style='color:#64748b; font-size:12px; margin-left:12px;'>4.0px stroke</span>
  </div>
</div>

<div class='row'>
  <div class='item'>
    <svg width="36" height="36" viewBox="0 0 48 48" fill="none">
      <path d="M11 36V19C11 13 15 10.5 20 12.5L24 25H37" stroke="#0D9488" stroke-width="4.4" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M37 36V19C37 13 33 10.5 28 12.5L24 25H11" stroke="#0F172A" stroke-width="4.4" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <div><span class='wm'>MediBridge</span><span class='ai'>AI</span></div>
    <span style='color:#64748b; font-size:12px; margin-left:12px;'>4.4px stroke (Optimal)</span>
  </div>
</div>

<div class='row'>
  <div class='item'>
    <svg width="36" height="36" viewBox="0 0 48 48" fill="none">
      <path d="M11 36V19C11 13 15 10.5 20 12.5L24 25H37" stroke="#0D9488" stroke-width="4.8" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M37 36V19C37 13 33 10.5 28 12.5L24 25H11" stroke="#0F172A" stroke-width="4.8" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <div><span class='wm'>MediBridge</span><span class='ai'>AI</span></div>
    <span style='color:#64748b; font-size:12px; margin-left:12px;'>4.8px stroke</span>
  </div>
</div>

</body>
</html>
